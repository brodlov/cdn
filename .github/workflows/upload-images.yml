name: Upload & Generate CDN URLs

on:
  workflow_dispatch:

  push:
    paths:
      - 'urls/**'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install

      # 1. Upload images (kalau ada script download/upload kamu)
      - name: Upload Images
        run: npm run upload

      # 2. Generate CDN URLs dari folder images
      - name: Generate CDN Lists
        run: npm run cdn

      # 3. Commit hasil (images + urls)
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add images urls-generated

          git diff --cached --quiet || git commit -m "Update images + CDN urls"

          git pull --rebase origin main
          git push
